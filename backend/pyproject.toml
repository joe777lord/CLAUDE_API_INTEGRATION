[tool.poetry]
name = "legal-pdf-summarizer-backend"
version = "0.1.0"
description = "FastAPI backend for legal PDF summarization with Claude"
authors = ["You <you@example.com>"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poe.tasks]
serve = "uvicorn app.main:app --reload --host 0.0.0.0 --port 8000"
test = "pytest -q --cov=app --cov-report=term-missing"
lint = "ruff check ."

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "0.115.0"
uvicorn = {version = "0.30.6", extras = ["standard"]}
python-multipart = "0.0.9"
pydantic = "2.9.2"
anthropic = "0.34.2"
pypdf = "5.0.1"
python-dotenv = "1.0.1"
httpx = "0.27.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
ruff = "^0.6.0"
poethepoet = "^0.37.0"

[tool.poetry.scripts]
serve = "uvicorn:main" # optional; see below
api = "app.main:main"

[tool.ruff]
line-length = 100